name: techo360-worker

# ============================================================
# Techo 360 - Worker de chatbot (pool de laboratorio)
# ------------------------------------------------------------
# NO reimplementa el chatbot: reutiliza la MISMA imagen de
# techo360-chatbot (Ollama + consumer de RabbitMQ ya existente
# en ese repo, app/rabbitmq_consumer.py). Este repo solo empaqueta
# esa imagen para correr en una maquina fuera del VPS -- el
# "worker" es un despliegue, no codigo nuevo del chatbot.
#
# Requiere el repo techo360-chatbot clonado como hermano de este
# (misma convencion que ya usa techo360-infra con sus servicios):
#   techo360/
#     techo360-chatbot/
#     techo360-workers/   <- este repo
#
# Prioridad de consumo: CHATBOT_CONSUMER_PRIORITY=10 (alta) hace
# que RabbitMQ le entregue los mensajes de 'chatbot_requests' a
# ESTE worker mientras este conectado, y solo caiga al consumer
# del VPS (prioridad 0, ver techo360-infra/docker-compose.yml)
# cuando ningun worker este activo. Nativo de RabbitMQ (x-priority
# en el consumer), sin nada custom -- ver
# techo360-chatbot/app/rabbitmq_consumer.py.
# ============================================================

volumes:
  ollama_worker_data:

services:
  ollama:
    image: ollama/ollama:0.6.8
    container_name: techo360-worker-ollama
    restart: unless-stopped
    volumes:
      - ollama_worker_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  chatbot-worker:
    image: ${WORKER_IMAGE:-techo360-worker-chatbot:v0.4.1-testing}
    container_name: techo360-worker-chatbot
    restart: unless-stopped
    environment:
      # Construido a partir de las variables de .env (ver .env.example) --
      # RABBITMQ_HOST es el UNICO valor pensado para cambiar entre esta
      # prueba (IP de Tailscale) y el despliegue final de laboratorio
      # (IP privada de la universidad, cuando RabbitMQ escuche ahi).
      # heartbeat=30 (aiormq lee `heartbeat` de la URL; por defecto 60 s y tolera 3
      # latidos perdidos): detecta en ~2 min, no ~3-4, una conexion muerta tras suspender
      # el PC o caer Tailscale (9-oct: 03:13-04:27 sin conexion). La reconexion en si es
      # de aio-pika (connect_robust, cada 5 s).
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/?heartbeat=30
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-techo360-chatbot:v0.4.1}
      CHATBOT_CONSUMER_PRIORITY: ${CHATBOT_CONSUMER_PRIORITY:-10}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-3072}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-4}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - worker-net
    # Healthcheck del proceso (el endpoint /health del chatbot). Solo informa
    # (`docker ps` / `docker inspect`): Docker no reinicia un contenedor `unhealthy`; el
    # reinicio ante un fallo lo da `restart: unless-stopped` cuando el proceso termina
    # (p. ej. si RabbitMQ no esta disponible al arrancar, uvicorn aborta y Docker lo
    # reintenta; visto el 9-oct a las 06:23).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Sin puertos publicados -- el worker no recibe HTTP, solo consume
    # de RabbitMQ (igual que el chatbot del VPS no expone puerto propio,
    # ver techo360-infra/docker-compose.yml).

networks:
  worker-net:
    driver: bridge
