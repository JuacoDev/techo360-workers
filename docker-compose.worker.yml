name: techo360-worker

# ============================================================
# Techo 360 - Worker de chatbot (pool de laboratorio)
# ------------------------------------------------------------
# NO reimplementa el chatbot: reutiliza la MISMA imagen de
# techo360-chatbot (Ollama + consumer de RabbitMQ ya existente
# en ese repo, app/rabbitmq_consumer.py). Este repo solo empaqueta
# esa imagen para correr en una maquina fuera del VPS -- el
# "worker" es un despliegue, no codigo nuevo del chatbot.
#
# Requiere el repo techo360-chatbot clonado como hermano de este
# (misma convencion que ya usa techo360-infra con sus servicios):
#   techo360/
#     techo360-chatbot/
#     techo360-workers/   <- este repo
#
# Prioridad de consumo: CHATBOT_CONSUMER_PRIORITY=10 (alta) hace
# que RabbitMQ le entregue los mensajes de 'chatbot_requests' a
# ESTE worker mientras este conectado, y solo caiga al consumer
# del VPS (prioridad 0, ver techo360-infra/docker-compose.yml)
# cuando ningun worker este activo. Nativo de RabbitMQ (x-priority
# en el consumer), sin nada custom -- ver
# techo360-chatbot/app/rabbitmq_consumer.py.
# ============================================================

volumes:
  ollama_worker_data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: techo360-worker-ollama
    restart: unless-stopped
    volumes:
      - ollama_worker_data:/root/.ollama
    networks:
      - worker-net
    # Sin GPU declarada aqui a proposito -- esta primera validacion
    # corre en el PC del usuario tal cual, CPU-only, igual que el VPS.
    # Si la maquina de laboratorio tiene GPU NVIDIA, agregar:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  chatbot-worker:
    build:
      # Contexto = el repo techo360-chatbot tal cual, SIN modificar --
      # mismo Dockerfile, mismo codigo, misma imagen que corre en el VPS.
      context: ../techo360-chatbot
    container_name: techo360-worker-chatbot
    restart: unless-stopped
    environment:
      # Construido a partir de las variables de .env (ver .env.example) --
      # RABBITMQ_HOST es el UNICO valor pensado para cambiar entre esta
      # prueba (IP de Tailscale) y el despliegue final de laboratorio
      # (IP privada de la universidad, cuando RabbitMQ escuche ahi).
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-techo360-chatbot:v3.2}
      CHATBOT_CONSUMER_PRIORITY: ${CHATBOT_CONSUMER_PRIORITY:-10}
      # Hilos de llama.cpp segun las CPU de esta maquina (ver README). La imagen del chatbot
      # lo ignora hasta que incluya OLLAMA_NUM_THREAD; sin valor queda en 3.
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-3}
    depends_on:
      - ollama
    networks:
      - worker-net
    # Sin puertos publicados -- el worker no recibe HTTP, solo consume
    # de RabbitMQ (igual que el chatbot del VPS no expone puerto propio,
    # ver techo360-infra/docker-compose.yml).

networks:
  worker-net:
    driver: bridge
